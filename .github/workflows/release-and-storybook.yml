name: Release & Storybook CD

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Application
        run: pnpm build

      - name: Build Storybook
        run: pnpm run build-storybook

      - name: Archive Production Build (Release only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar -czf release-build.tar.gz -C dist .

      - name: Create GitHub Release (Release only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-build.tar.gz
          name: Release ${{ github.ref_name }}
          body: |
            Automated release generated for tag ${{ github.ref_name }}.
            
            ### Assets Included
            - `release-build.tar.gz` : Minified and bundled production assets of the Customer Operations Portal.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy Storybook to App Build
        run: cp -r storybook-static dist/storybook

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
